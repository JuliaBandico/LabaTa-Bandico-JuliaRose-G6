<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabaTa – Orders</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
    th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; }
    .alert { padding: .6rem 1rem; margin: .5rem 0; border-radius: 6px; }
    .alert-success { background: #e6f6ea; color: #1a6b32; }
    .alert-danger { background: #fdeaea; color: #a12626; }
    .errorlist { color: #a12626; list-style: none; padding: 0; margin: .25rem 0; }
    nav a { margin-right: 1rem; }
  </style>
</head>
<body>
  <nav>
    {% if user_role == "shop_owner" %}
      <a href="{% url 'manage:owner_dashboard' %}">Dashboard</a>
      <a href="{% url 'orders:list' %}">Orders</a>
      <a href="{% url 'orders:services' %}">Services</a>
    {% elif user_role == "counter_staff" %}
      <a href="{% url 'orders:staff_dashboard' %}">Dashboard</a>
      <a href="{% url 'orders:list' %}">Orders</a>
    {% else %}
      <a href="{% url 'customer_dashboard' %}">Dashboard</a>
      <a href="{% url 'orders:list' %}">My orders</a>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
